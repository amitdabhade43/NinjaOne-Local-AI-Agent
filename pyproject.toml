[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ninjaone-local-ai-agent"
version = "0.2.0"
description = "A local, model-independent NinjaOne AI agent for Microsoft Foundry Local and MCP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.50,<3",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "mcp>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ninjaone_agent = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
