[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ninjaone-local-ai-agent"
version = "0.1.0"
description = "A model-independent local AI agent foundation for NinjaOne and Microsoft Foundry Local."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "openai>=1.50,<3", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
